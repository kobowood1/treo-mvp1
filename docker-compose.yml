services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: treo
      POSTGRES_PASSWORD: treo_dev_password
      POSTGRES_DB: treo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treo -d treo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: treo_minio
      RUSTFS_SECRET_KEY: treo_minio_secret
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Bucket init (runs once)
  bucket-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: treo_minio
      AWS_SECRET_ACCESS_KEY: treo_minio_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
        aws --endpoint-url http://rustfs:9000 s3 mb s3://treo-uploads --region us-east-1 || true &&
        echo 'Bucket ready.'
      "

  math-service:
    build:
      context: ./services/math
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001

volumes:
  postgres_data:
  rustfs_data:
